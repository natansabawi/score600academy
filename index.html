<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score600Academy</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- PDF-Lib for Client-Side Watermarking -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 15px; }
        h1 { font-size: 20px; text-align: center; color: #2c3e50; }
        .subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 20px; }
        .grade-section { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .grade-section h3 { margin-top: 0; color: #0088cc; font-size: 16px; border-bottom: 2px solid #0088cc; padding-bottom: 5px; }
        .chapter-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .chapter-card:last-child { border-bottom: none; }
        button { background: #0088cc; color: white; border: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
        button:active { background: #006699; }
    </style>
</head>
<body>
    <h1>Score600Academy 📚</h1>
    <div class="subtitle">Secure Study Companion & Exam Prep</div>

    <div class="grade-section">
        <h3>Grade 9 Study Materials / 9ኛ ክፍል የትምህርት 资料</h3>
        
        <div class="chapter-card">
            <span>History Unit 1 (EUEE Complete)</span>
            <button onclick="downloadProtectedPdf('/materials/grade9_history_ch1.pdf', 'Grade9_History_Unit1')">Download PDF</button>
        </div>
        
        <div class="chapter-card">
            <span>Chemistry Unit 1 Study Guide</span>
            <button onclick="downloadProtectedPdf('/materials/grade9_chemistry_ch1.pdf', 'Grade9_Chemistry_Unit1')">Download PDF</button>
        </div>

        <div class="chapter-card">
            <span>Chemistry Unit 2 Study Guide</span>
            <button onclick="downloadProtectedPdf('/materials/grade9_chemistry_ch2.pdf', 'Grade9_Chemistry_Unit2')">Download PDF</button>
        </div>

        <div class="chapter-card">
            <span>Economics Unit 1 (EUEE Complete)</span>
            <button onclick="downloadProtectedPdf('/materials/grade9_economics_ch1.pdf', 'Grade9_Economics_Unit1')">Download PDF</button>
        </div>
    </div>

    <!-- Links to your separate app.js logic -->
    <script src="app.js"></script>
</body>
</html>
