<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score600Academy</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- PDF-Lib for Client-Side Watermarking -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 15px; }
        h1 { font-size: 20px; text-align: center; color: #2c3e50; }
        .subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 20px; }
        .grade-section { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .grade-section h3 { margin-top: 0; color: #0088cc; font-size: 16px; border-bottom: 2px solid #0088cc; padding-bottom: 5px; }
        .chapter-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .chapter-card:last-child { border-bottom: none; }
        button { background: #0088cc; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
        button:active { background: #006699; }
    </style>
</head>
<body>
    <h1>Score600Academy 📚</h1>
    <div class="subtitle">Secure Study Companion & Exam Prep</div>

    <div class="grade-section">
        <h3>Grade 9 Study Materials</h3>
        <div class="chapter-card">
            <span>History Unit 1 (EUEE Complete)</span>
            <button onclick="downloadProtectedPdf('grade9_history_ch1.pdf', 'Grade9_History_Unit1')">Download PDF</button>
        </div>
    </div>

    <script>
        async function downloadProtectedPdf(pdfFileName, gradeTitle) {
            try {
                const tg = window.Telegram?.WebApp;
                const user = tg?.initDataUnsafe?.user;
                
                const userName = user ? `${user.first_name} ${user.last_name || ''}`.trim() : "Score600Academy Student";
                const userId = user ? user.id : "Guest";
                const timestamp = new Date().toISOString().split('T')[0];

                const pdfUrl = `${window.location.origin}/materials/${pdfFileName}`;
                console.log("Fetching from absolute URL:", pdfUrl);

                const response = await fetch(pdfUrl);
                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}. Make sure the PDF file exists in the materials folder.`);
                }
                
                const existingPdfBytes = await response.arrayBuffer();

                const { PDFDocument, rgb, degrees, StandardFonts } = PDFLib;
                const pdfDoc = await PDFDocument.load(existingPdfBytes);
                
                const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                const pages = pdfDoc.getPages();
                
                const watermarkText = `LICENSED TO: ${userName} (ID: ${userId}) - ${timestamp}`;

                for (const page of pages) {
                    const { width, height } = page.getSize();
                    
                    page.drawRectangle({
                        x: width * 0.1,
                        y: height * 0.5,
                        width: width * 0.8,
                        height: 30,
                        color: rgb(1, 0, 0),
                        opacity: 0.7,
                    });

                    page.drawText(watermarkText, {
                        x: (width * 0.1) + 10,
                        y: (height * 0.5) + 10,
                        size: 11,
                        font: font,
                        color: rgb(1, 1, 1),
                    });
                }

                const modifiedPdfBytes = await pdfDoc.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `${gradeTitle}_Protected.pdf`;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

            } catch (error) {
                console.error("Watermark error:", error);
                alert("Download failed: " + error.message);
            }
        }
    </script>
</body>
</html>
