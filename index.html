<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score600Academy Secure Reader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 10px; -webkit-user-select: none; user-select: none; }
        h1 { font-size: 18px; text-align: center; color: #2c3e50; margin: 5px 0; }
        .subtitle { text-align: center; font-size: 12px; color: #666; margin-bottom: 10px; }
        .menu-container { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .menu-container h3 { margin: 0 0 10px 0; color: #0088cc; font-size: 14px; border-bottom: 2px solid #0088cc; padding-bottom: 5px; }
        .chapter-btn { display: block; width: 100%; background: #f8f9fa; color: #333; border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; text-align: left; }
        .chapter-btn:hover { background: #e2e6ea; }
        #reader-container { display: none; background: white; padding: 8px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .controls-bar { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .action-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .max-btn { background: #27ae60; }
        iframe { width: 100%; height: 72vh; border: none; border-radius: 5px; }
        #reader-container.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; padding: 10px; box-sizing: border-box; background: #fff; }
        #reader-container.fullscreen iframe { height: calc(100vh - 50px); }
    </style>
</head>
<body oncontextmenu="return false;">
    <h1>Score600Academy 📚</h1>
    <div class="subtitle">Secure In-App Study Reader</div>

    <div id="menu" class="menu-container">
        <h3>Grade 9 Study Materials</h3>
        <button class="chapter-btn" onclick="openReader('materials/grade9_history_ch1.pdf', 'History Unit 1')">
            📖 History Unit 1 (EUEE Complete)
        </button>
    </div>

    <div id="reader-container">
        <div class="controls-bar">
            <button class="action-btn" onclick="closeReader()">⬅ Back</button>
            <button class="action-btn max-btn" onclick="toggleMaximize()">⛶ Maximize / Fullscreen</button>
        </div>
        <h3 id="reader-title" style="margin: 5px 0; font-size: 14px; color: #333;"></h3>
        <iframe id="pdf-frame" src=""></iframe>
    </div>

    <script>
        function openReader(pdfPath, title) {
            const absoluteUrl = `${window.location.origin}/${pdfPath}#toolbar=0&navpanes=0&scrollbar=0`;
            document.getElementById('pdf-frame').src = absoluteUrl;
            document.getElementById('reader-title').innerText = title;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('reader-container').style.display = 'block';
        }
        function closeReader() {
            document.getElementById('reader-container').classList.remove('fullscreen');
            document.getElementById('pdf-frame').src = '';
            document.getElementById('reader-container').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
        }
        function toggleMaximize() {
            document.getElementById('reader-container').classList.toggle('fullscreen');
        }
    </script>
</body>
</html>
