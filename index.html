<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score600Academy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Score600Academy</h1>
            <p>Grades 9 - 12 Study Materials & PDFs</p>
            <p class="amharic-sub">የ9ኛ - 12ኛ ክፍል ነፃ የማጥኛ ማስታወሻዎች</p>
        </header>

        <main>
            <section class="grade-selector">
                <h2>Select Your Grade / ክፍል ይምረጡ</h2>
                <div class="grade-buttons">
                    <button onclick="loadGrade(9)">Grade 9 / 9ኛ ክፍል</button>
                    <button onclick="loadGrade(10)">Grade 10 / 10ኛ ክፍል</button>
                    <button onclick="loadGrade(11)">Grade 11 / 11ኛ ክፍል</button>
                    <button onclick="loadGrade(12)">Grade 12 / 12ኛ ክፍል</button>
                </div>
            </section>

            <section id="content-area" class="hidden">
                <button class="back-btn" onclick="goBack()">⬅ Back / ተመለስ</button>
                <h3 id="selected-grade-title"></h3>
                <div id="subject-list" class="subject-list"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
